<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabalho 3 - Consulta de CEP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <my-header></my-header>

    <my-nav></my-nav>

    <main class="container my-4">

        <div class="card p-4 shadow">

            <h2>Trabalho 3 - Consulta de CEP</h2>

            <p>
                Nesta página você pode consultar um CEP utilizando a BrasilAPI.
                Digite um CEP válido contendo apenas números e clique em
                <strong>Consultar</strong>.
            </p>

            <form id="formCep">

                <div class="mb-3">

                    <label for="cep" class="form-label">
                        CEP
                    </label>

                    <input
                        type="text"
                        id="cep"
                        class="form-control"
                        maxlength="8"
                        placeholder="Ex.: 96010170"
                        required>

                </div>

                <button class="btn btn-primary" type="submit">
                    Consultar
                </button>

            </form>

            <hr>

            <div id="resultadoCep">

                <p class="text-muted">
                    Nenhuma consulta realizada.
                </p>

            </div>

            <hr>

            <div class="text-end">

                <a href="apis.html" class="btn btn-success">
                    Ir para Trabalho 3 - Parte 2 →
                </a>

            </div>

        </div>

    </main>

    <my-footer></my-footer>

    <script src="script.js"></script>

</body>

</html>
